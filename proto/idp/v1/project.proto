syntax = "proto3";

package idp.v1;

import "idp/v1/common.proto";

option go_package = "github.com/idp/platform/backend/internal/gen/idp/v1;idpv1";

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
}

message Project {
  string id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  string owner_id = 5;
  string owner_email = 6;
  map<string, string> labels = 7;
  string status = 8;
  int32 member_count = 9;
  int32 namespace_count = 10;
  string created_at = 11;
  string updated_at = 12;
}

message ProjectMember {
  string project_id = 1;
  string user_id = 2;
  string user_email = 3;
  // role: developer | viewer  (admins have implicit access to every project)
  string role = 4;
  string added_at = 5;
}

message CreateProjectRequest {
  string slug = 1;
  string name = 2;
  string description = 3;
  map<string, string> labels = 4;
}
message CreateProjectResponse { Project project = 1; }

message GetProjectRequest { string slug = 1; }
message GetProjectResponse { Project project = 1; }

message ListProjectsRequest {
  PageRequest page = 1;
  // when true, return only projects the caller belongs to (default for non-admins)
  bool mine_only = 2;
}
message ListProjectsResponse {
  repeated Project projects = 1;
  PageInfo page_info = 2;
}

message UpdateProjectRequest {
  string slug = 1;
  string name = 2;
  string description = 3;
  map<string, string> labels = 4;
}
message UpdateProjectResponse { Project project = 1; }

message DeleteProjectRequest { string slug = 1; }
message DeleteProjectResponse {}

message AddMemberRequest {
  string project_slug = 1;
  string user_email = 2;
  string role = 3; // developer | viewer
  // Optional Keycloak username; defaults to the email address.
  string username = 4;
  // Password for the Keycloak login. Required when the user does not yet
  // exist in Keycloak; ignored (keeps current password) when they already do
  // unless you want to reset it.
  string password = 5;
  // When true, Keycloak forces a password change on next login.
  bool temporary_password = 6;
}
message AddMemberResponse {
  ProjectMember member = 1;
  // True when a new Keycloak login was created for this member.
  bool keycloak_user_created = 2;
  // Username they should use on the IDP login screen.
  string login_username = 3;
}

message RemoveMemberRequest {
  string project_slug = 1;
  string user_email = 2;
}
message RemoveMemberResponse {}

message ListMembersRequest { string project_slug = 1; }
message ListMembersResponse { repeated ProjectMember members = 1; }
