server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes probes need a target that never depends on the SPA bundle.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Hashed asset filenames are content-addressed, so they can be cached
    # indefinitely — a changed file gets a different name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a browser keeps loading the old
    # bundle after a deploy and requests asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: the app owns /projects, /namespaces and the rest,
    # so a hard refresh on any of them must still serve the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app talks to the backend cross-origin, so no upstream is named here.
    # These headers only harden what this origin itself serves.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
